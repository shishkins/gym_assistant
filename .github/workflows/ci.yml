name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym
          POSTGRES_DB: gym_assistant_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gym"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      BOT_TOKEN: "000000:test-token-not-real"
      ALLOWED_TELEGRAM_IDS: "1"
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym
      POSTGRES_DB: gym_assistant_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src/gym_assistant

      - name: Alembic migrations apply cleanly
        run: uv run alembic upgrade head

      - name: Pytest
        run: uv run pytest

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build bot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/bot.Dockerfile
          push: false
          load: true
          tags: gym-assistant-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building is not the same as running: a missing file or a broken
      # entrypoint only shows up when the image actually starts.
      - name: Smoke-test the image
        run: |
          docker run --rm gym-assistant-bot:ci python -c "import gym_assistant; print(gym_assistant.__version__)"
          docker run --rm gym-assistant-bot:ci alembic --version
          test "$(docker run --rm gym-assistant-bot:ci id -u)" = "10001"
