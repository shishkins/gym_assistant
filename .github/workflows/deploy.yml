# Deploys to the VPS on every green push to main.
#
# Disabled until you set the repository variable DEPLOY_ENABLED=true
# (Settings -> Secrets and variables -> Actions -> Variables).
#
# Required secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY
# Optional secret:  SSH_PORT (defaults to 22)

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-bot

jobs:
  build-and-push:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/bot.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/gym_assistant

            git fetch --all
            git reset --hard origin/main

            echo "BOT_IMAGE=ghcr.io/${{ github.repository }}-bot:sha-${{ github.sha }}" > .env.image

            docker compose --env-file .env --env-file .env.image pull bot
            docker compose --env-file .env --env-file .env.image run --rm bot alembic upgrade head
            docker compose --env-file .env --env-file .env.image up -d

            # Give the bot a moment, then verify it is actually alive.
            sleep 10
            if [ "$(docker inspect -f '{{.State.Running}}' gym-assistant-bot-1)" != "true" ]; then
              echo "Bot container is not running after deploy" >&2
              docker compose logs --tail=100 bot >&2
              exit 1
            fi
            echo "Deploy OK: sha-${{ github.sha }}"
